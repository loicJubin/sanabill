fr:
  eyebrow: "ZERO · par Sanabill"
  title: "Structurer et piloter les refus d’assurances, simplement"
  description: >
    Les refus et contestations d’assurances sont souvent traités de manière fragmentée :
    fichiers multiples, suivis manuels, manque de visibilité sur l’état réel des dossiers.
    ZERO est l’outil développé par Sanabill pour structurer la gestion des refus, améliorer
    le pilotage et soutenir les équipes administratives et financières au quotidien.
  cta_primary: "Échanger autour de ZERO"
  cta_secondary: "Voir les fonctionnalités"
  hero_image_alt: "Tableau de bord ZERO : contestations en cours, classification, distribution, traitement, validation et paiement, avec montants en CHF"

  stats_title: "Résultats observés"
  stats:
    - number: "−25 %"
      label: "de délais de traitement des refus*"
    - number: "87 %"
      label: "de satisfaction des utilisateurs*"
    - number: "−99 %"
      label: "de temps consacré au suivi*"
    - number: "97 %"
      label: "de fiabilité des données*"
  stats_disclaimers: "*Résultats observés chez nos premiers clients. Les gains dépendent du contexte, des volumes traités et de l’organisation existante."

  features:
    eyebrow: "Fonctionnalités"
    title: "Ce que ZERO permet concrètement"
    subtitle: "ZERO ne remplace pas vos équipes. Il leur donne un cadre clair pour travailler efficacement."
    list:
      - "Centraliser l’ensemble des refus et contestations d’assurances"
      - "Catégoriser les refus selon des logiques métier compréhensibles"
      - "Attribuer et suivre les dossiers de manière structurée"
      - "Visualiser l’état des factures et contestations en cours"
      - "Conserver un historique complet et traçable de chaque action"
      - "S’intégrer progressivement à vos systèmes de facturation existants"

  features_showcase:
    - title: "Suivi des refus"
      description: "Une vue d’ensemble claire de tous les refus et contestations en cours, pour prioriser les actions et piloter l’activité."
      image_path: "/assets/images/pilotage_zero.webp"
      image_width: 1000
      image_height: 539
      image_description: "Aperçu du tableau de bord de suivi"
    - title: "Analyse des catégories"
      description: "Une lecture structurée des causes de refus, pour identifier les points d’amélioration dans les processus de facturation et réduire les erreurs avant facturation."
      image_path: "/assets/images/analytic_classifications_variant.webp"
      image_width: 992
      image_height: 319
      image_description: "Tableau d’analyse des catégories de refus"
    - title: "Chronologie"
      description: "Chaque dossier conserve l’historique complet des actions, y compris après refacturation. Traçabilité totale et moins de temps passé à rechercher la raison des corrections."
      image_path: "/assets/images/chronology.webp"
      image_width: 1000
      image_height: 641
      image_description: "Vue chronologique des actions"

  principles:
    eyebrow: "Intégration & données"
    title: "Conçu pour s’intégrer, pas pour tout remplacer"
    items:
      - title: "Intégration progressive"
        description: "ZERO s’adapte à vos systèmes de facturation existants et s’adopte étape par étape."
      - title: "Vos données vous appartiennent"
        description: "Basé sur des technologies open source : vous restez pleinement propriétaire de vos données et de leur usage."
      - title: "Un cadre, pas une contrainte"
        description: "Pas d’automatisation à tout prix : un cadre clair pour l’équipe, qui respecte vos pratiques."

  # Citations utilisateurs : à n'afficher qu'une fois validées par les personnes concernées.
  testimonial:
    enabled: false
    title: "Ce que disent les utilisateurs de ZERO"
    items:
      - description: "« Avant ZERO, le suivi des refus était très morcelé. Aujourd’hui, nous avons une vue claire sur les dossiers en cours et sur ce qui bloque réellement. »"
        person: "Responsable administratif, organisation de santé (Suisse)"
      - description: "« ZERO s’intègre bien dans notre environnement existant. Nous avons pu l’adopter progressivement, sans remettre en cause nos processus du jour au lendemain. »"
        person: "Responsable facturation, organisation de santé"
      - description: "« L’outil nous a surtout aidés à structurer notre manière de travailler. Ce n’est pas de l’automatisation à tout prix, mais un cadre clair pour l’équipe. »"
        person: "Responsable financier, établissement de soins"

  contact:
    title: "Vous souhaitez découvrir ZERO ?"
    description: "Discutons de votre contexte et voyons ensemble si ZERO répond à vos besoins en matière de gestion des refus d’assurances."
    email: "contact@sanabill.ch"
