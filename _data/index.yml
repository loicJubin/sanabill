fr:
  hero:
    eyebrow: "Conseil en contestations d’assurances · Lausanne"
    title: "Reprenez le contrôle de vos refus d’assurances"
    description: >
      Nous accompagnons les organisations de santé dans l’analyse et l’optimisation
      de la gestion des contestations d’assurances. Avec notre expertise métier et ZERO,
      notre outil de pilotage, vos équipes structurent et suivent chaque refus plus efficacement.
    cta_primary: "Planifier un diagnostic"
    cta_secondary: "Découvrir ZERO"
    zero_line:
      - "Zéro dossier oublié"
      - "Zéro fichier éparpillé"
      - "Zéro complexité inutile"
    image_alt: "Tableau de bord ZERO : suivi des contestations par statut, avec volumes, montants en CHF et évolution"

  partners:
    title: "Ils nous font confiance"
    items:
      - name: "Hôpital ophtalmique Jules-Gonin"
        url: "https://www.ophtalmique.ch/"
        logo: "/assets/images/partners/HoJGnoir.gif"
    facts:
      - "Entreprise suisse"
      - "Technologies open source"
      - "Vous restez propriétaire de vos données"

  problem:
    eyebrow: "Le constat"
    title: "Des refus traités de manière fragmentée"
    subtitle: "Dans beaucoup d’organisations de santé, la gestion des contestations repose sur quelques personnes et beaucoup de temps."
    items:
      - title: "Fichiers multiples"
        description: "Les informations sont dispersées entre tableurs, e-mails et logiciels de facturation."
      - title: "Suivi manuel"
        description: "Statuts et délais sont suivis à la main, avec un risque réel d’oubli."
      - title: "Peu de visibilité"
        description: "Difficile de savoir combien de dossiers sont ouverts, ce qui bloque et pourquoi."

  approach:
    eyebrow: "Notre approche"
    title: "Du diagnostic au pilotage, étape par étape"
    subtitle: "Le métier avant la technologie : nous analysons vos processus avant de proposer des solutions."
    steps:
      - title: "Diagnostic des contestations"
        description: "Analyse de votre situation actuelle, identification des causes de refus et recommandations concrètes pour améliorer vos processus."
        link: "/fr/services/#consulting-contestations"
        link_label: "Le conseil en contestations"
      - title: "Structuration avec ZERO"
        description: "Un cadre commun pour centraliser, suivre et piloter vos refus, intégré progressivement à vos pratiques existantes."
        link: "/fr/zero/"
        link_label: "Découvrir ZERO"
      - title: "Optimisation & automatisation"
        description: "Simplification de vos flux administratifs pour réduire le travail manuel, les ressaisies et les erreurs."
        link: "/fr/services/#optimisation-automatisation"
        link_label: "L’optimisation administrative"

  zero:
    eyebrow: "ZERO"
    title: "L’outil qui rend vos refus visibles"
    description: >
      ZERO centralise les refus et contestations d’assurances, les catégorise selon des
      logiques métier et donne à vos équipes une vue claire des volumes, des statuts et des résultats.
    link_label: "Voir ce que ZERO permet"
    image_alt: "Analyse des catégories de refus dans ZERO"

  why_us:
    eyebrow: "Pourquoi Sanabill"
    title: "Un partenaire métier, pas une surcouche de plus"
    reasons:
      - title: "Ancrés dans la réalité du terrain"
        description: "La gestion des refus est d’abord un enjeu administratif et organisationnel. Nous construisons des réponses adaptées à vos pratiques existantes."
      - title: "Le métier avant la technologie"
        description: "Le conseil et ZERO s’inscrivent dans une même logique : améliorer concrètement la gestion des contestations, sans surcouche inutile."
      - title: "Simple et pragmatique"
        description: "Pas de projets lourds ni d’outils complexes. Des améliorations ciblées, progressives et directement utiles."
      - title: "À votre rythme"
        description: "Diagnostic ponctuel ou démarche plus globale : nous avançons avec vos équipes, étape par étape."

  cta:
    title: "Une question ou un enjeu spécifique ?"
    subtitle: "Échangeons sur votre situation et voyons ensemble par où commencer."
    label: "Planifier un diagnostic"
    url: "/fr/contact/"
