<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#ffffff" />
        {% seo %}
        <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}" />
        <link rel="preload" href="{{ '/assets/fonts/inter-latin-var.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
        <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
        {% if jekyll.environment == "production" %}
        <script defer src="https://cloud.umami.is/script.js" data-website-id="e18cf15d-4d6b-44e6-a489-50e3e1658d2f"></script>
        {% endif %}
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Sanabill Sàrl",
          "url": "{{ site.url }}",
          "logo": "{{ site.logo | absolute_url }}",
          "email": "{{ site.email }}",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Avenue d'Echallens 61",
            "postalCode": "1004",
            "addressLocality": "Lausanne",
            "addressCountry": "CH"
          }
        }
        </script>
    </head>

    <body>
      <a class="skip-link" href="#main">Aller au contenu</a>
      {% include header.html %}

      <main id="main" tabindex="-1">
        {{ content }}
      </main>

      {% include footer.html %}
    </body>
</html>
