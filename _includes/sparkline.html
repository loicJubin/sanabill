{% comment %} Decorative sparkline in the style of the ZERO dashboard. Param: trend ("up" | "down") {% endcomment %}
<svg class="sparkline" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  {% if include.trend == "down" %}
  <polyline points="0,8 12,6 24,10 36,9 48,14 60,13 72,19 84,20 96,24 108,25 120,27" />
  {% else %}
  <polyline points="0,26 12,25 24,22 36,23 48,17 60,16 72,12 84,11 96,8 108,7 120,5" />
  {% endif %}
</svg>
