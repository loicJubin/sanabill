{% comment %} Params: eyebrow, title, subtitle, narrow (true to align with a narrow content column), id (anchor, default "introduction") {% endcomment %}
<section class="page-hero" id="{{ include.id | default: 'introduction' }}">
  <div class="container{% if include.narrow %} container--narrow{% endif %}">
    <div class="page-hero__content">
      <p class="eyebrow">{{ include.eyebrow }}</p>
      <h1 class="page-hero__title">{{ include.title }}</h1>
      {% if include.subtitle %}<p class="page-hero__subtitle">{{ include.subtitle }}</p>{% endif %}
    </div>
  </div>
</section>
