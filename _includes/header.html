<header class="header">
    <nav class="header__nav container" aria-label="Navigation principale">
        <a href="{{ '/' | relative_url }}" class="logo" aria-label="Sanabill, accueil">
            <span class="logo__primary">Sana</span><span class="logo__secondary">bill</span>
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="navMenu">
            <span class="sr-only">Menu</span>
            <span class="menu-toggle__bar" aria-hidden="true"></span>
            <span class="menu-toggle__bar" aria-hidden="true"></span>
            <span class="menu-toggle__bar" aria-hidden="true"></span>
        </button>
        <ul id="navMenu" class="header__menu">
          {% for link in site.data.header.links %}
            <li>
              <a href="{{ link.url | relative_url }}" class="header__link"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.label }}</a>
            </li>
          {% endfor %}
          <li class="header__cta">
            <a href="{{ site.data.header.cta.url | relative_url }}" class="btn btn--primary btn--sm"{% if page.url == site.data.header.cta.url %} aria-current="page"{% endif %}>{{ site.data.header.cta.label }}</a>
          </li>
        </ul>
    </nav>
</header>
