# Site settings
title: Sanabill
lang: fr
locale: fr_CH
email: contact@sanabill.ch
description: >-
  Sanabill accompagne les organisations de santé suisses dans la gestion des
  refus et contestations d'assurances : conseil, structuration des processus
  et ZERO, l'outil de pilotage des refus.
url: "https://sanabill.ch"
baseurl: ""
logo: /assets/images/favicon.png

# Used by jekyll-seo-tag for the schema.org Organization markup
social:
  name: Sanabill Sàrl

# Build settings
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: fr
  - scope:
      path: "assets/images"
    values:
      image: true

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
